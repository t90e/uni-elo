<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uni Overwatch Smash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="banner">
  <h1>Uni Overwatch Smash</h1>
</div>

<div class="site-nav">
  <a href="/" class="active">Vote</a>
  <a href="/leaderboard">Rankings</a>
</div>

<div class="page-content">
  <div class="question">Who would you rather have on your team? Removed alot of people. Matchups should be more fun</div>

  <div class="arena" id="arena">

    <div class="player-card" id="card1">
      <div class="photo-wrap" id="wrap1"></div>
      <div class="p-name"  id="name1"></div>
      <div class="p-team"  id="team1"></div>
      <div class="winner-label" id="win1"></div>
    </div>

    <div class="or-divider">or</div>

    <div class="player-card" id="card2">
      <div class="photo-wrap" id="wrap2"></div>
      <div class="p-name"  id="name2"></div>
      <div class="p-team"  id="team2"></div>
      <div class="winner-label" id="win2"></div>
    </div>

  </div>

  <div class="skip-wrap">
    <button id="skip-btn">Skip</button>
  </div>

  <div class="votes-box">
    <span class="votes-num" id="vote-count">{{ total_votes }}</span>
    <span class="votes-label">Total Votes</span>
  </div>

</div>

<script src="{{ url_for('static', filename='vote.js') }}"></script>
</body>
</html>
